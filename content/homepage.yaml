whyUs:
  - heading: Fifty years of continuous service
    body: Trading without interruption since 1975, to both industry and the trade. Long
      enough to have seen most problems before.
  - heading: Authorised distribution
    body: Authorised distributor for seven established brands, so what you receive is
      genuine and properly supported.
  - heading: Ready stock, not back orders
    body: Plummer blocks and adapter sleeves for shaft sizes from 1" to 7", covering the
      S, SN, SNA, SNH and MNL series.
  - heading: Non-standard sizes made to requirement
    body: Where equipment falls outside conventional dimensions, including replacement and
      retrofit work, we manufacture to suit.
  - heading: Technical guidance
    body: A team that knows the products, so the housing, sleeve and locking component you
      order actually fit together.
  - heading: Delivered on time
    body: Stock held in Chennai and dispatched across India, because a bearing that arrives
      late has already cost you a shutdown.
customWorkTitle: Non-standard and custom requirements
customWorkBody: Beyond our standard catalogue we specialise in non-standard sizes of plummer
  blocks and sleeves, supporting customers whose equipment falls outside conventional
  dimensions. If you are maintaining older machinery, or an imported line where the original
  part is no longer available, send us the dimensions and we will tell you what is possible.
